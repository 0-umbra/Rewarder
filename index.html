<!DOCTYPE html>
<html>
<head>
    <title>Reward App</title>
</head>

<body>

    <h1>🎁 Reward App</h1>

    <h2>Welcome!</h2>

    <p>Your Points:</p>

    <h1 id="points">0</h1>

    <button onclick="claimPoints()">
        Daily Login +100 Points
    </button>

    <br><br>

    <button onclick="redeem()">
        Redeem 60 UC
    </button>

    <script>
        let points = 0;

        function claimPoints() {
            points += 100;
            document.getElementById("points").innerText = points;
        }

        function redeem() {
            if (points >= 100) {
                points -= 100;
                document.getElementById("points").innerText = points;
                alert("Redemption request created!");
            } else {
                alert("You need 100 points.");
            }
        }
    </script>

</body>
</html>
