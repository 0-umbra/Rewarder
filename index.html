<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reward App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        .card {
            background: white;
            margin: 25px 15px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        input {
            width: 90%;
            max-width: 350px;
            padding: 13px;
            margin: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 90%;
            max-width: 350px;
            padding: 14px;
            margin: 7px;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .logout {
            background: #dc2626;
            color: white;
        }

        .points {
            font-size: 40px;
            font-weight: bold;
            margin: 15px;
        }

        .hidden {
            display: none;
        }

        .message {
            margin: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎁 Reward App</h1>
        <p>Earn points and redeem rewards</p>
    </div>

    <!-- LOGIN -->
    <div class="card" id="loginScreen">

        <h2>Login / Sign Up</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="primary" onclick="signUp()">
            Create Account
        </button>

        <button class="primary" onclick="login()">
            Login
        </button>

        <div class="message" id="loginMessage"></div>

    </div>


    <!-- APP -->
    <div class="card hidden" id="appScreen">

        <h2>Your Points</h2>

        <div class="points" id="points">
            0
        </div>

        <button class="primary" onclick="claimDaily()">
            📅 Daily Login +100 Points
        </button>

        <button onclick="redeemUC()">
            🎮 Redeem 60 UC
        </button>

        <p id="appMessage"></p>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <!-- Firebase -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            updateDoc
        }
        from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        // 🔥 PUT YOUR FIREBASE CONFIG HERE

        const firebaseConfig = {
    apiKey: "AIzaSyDi2M5_Yhm5DKyRuBZBOg5Yt3aiYUgcoiU",
    authDomain: "rewarder-c4903.firebaseapp.com",
    projectId: "rewarder-c4903",
    storageBucket: "rewarder-c4903.firebasestorage.app",
    messagingSenderId: "647910037300",
    appId: "1:647910037300:web:09b4adff6f21a4360c3761",
    measurementId: "G-66V6SW7QVE"
};


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // SIGN UP

        window.signUp = async function() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                const user =
                    userCredential.user;


                await setDoc(
                    doc(db, "users", user.uid),
                    {
                        email: user.email,
                        points: 0,
                        lastClaim: null
                    }
                );


                document.getElementById("loginMessage").innerText =
                    "✅ Account created!";

            } catch (error) {

                document.getElementById("loginMessage").innerText =
                    "❌ " + error.message;

            }

        };


        // LOGIN

        window.login = async function() {

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            } catch (error) {

                document.getElementById("loginMessage").innerText =
                    "❌ " + error.message;

            }

        };


        // LOGOUT

        window.logout = async function() {

            await signOut(auth);

        };


        // CHECK LOGIN

        onAuthStateChanged(auth, async (user) => {

            if (user) {

                document
                    .getElementById("loginScreen")
                    .classList.add("hidden");

                document
                    .getElementById("appScreen")
                    .classList.remove("hidden");

                await loadPoints(user.uid);

            } else {

                document
                    .getElementById("loginScreen")
                    .classList.remove("hidden");

                document
                    .getElementById("appScreen")
                    .classList.add("hidden");

            }

        });


        // LOAD POINTS

        async function loadPoints(uid) {

            const userDoc =
                await getDoc(
                    doc(db, "users", uid)
                );

            if (userDoc.exists()) {

                document
                    .getElementById("points")
                    .innerText =
                    userDoc.data().points || 0;

            }

        }


        // DAILY LOGIN

        window.claimDaily = async function() {

            const user = auth.currentUser;

            if (!user) return;


            const userRef =
                doc(db, "users", user.uid);

            const userDoc =
                await getDoc(userRef);

            const data =
                userDoc.data();


            const today =
                new Date().toISOString().split("T")[0];


            if (data.lastClaim === today) {

                document
                    .getElementById("appMessage")
                    .innerText =
                    "❌ You already claimed today's points.";

                return;

            }


            const newPoints =
                (data.points || 0) + 100;


            await updateDoc(
                userRef,
                {
                    points: newPoints,
                    lastClaim: today
                }
            );


            document
                .getElementById("points")
                .innerText =
                newPoints;


            document
                .getElementById("appMessage")
                .innerText =
                "🎉 You received 100 points!";

        };


        // REDEEM //
        window.redeemUC = async function() {

    const user = auth.currentUser;

    if (!user) {
        return;
    }

    const userRef = doc(db, "users", user.uid);

    const userDoc = await getDoc(userRef);

    if (!userDoc.exists()) {
        document.getElementById("appMessage").innerText =
            "❌ User account not found.";
        return;
    }

    const data = userDoc.data();

    const currentPoints = data.points || 0;

    if (currentPoints < 100) {
        document.getElementById("appMessage").innerText =
            "❌ You need 100 points to redeem 60 UC.";
        return;
    }

    const newPoints = currentPoints - 100;

    await updateDoc(userRef, {
        points: newPoints
    });

    const redemptionId =
        crypto.randomUUID();

    await setDoc(
        doc(db, "redemptions", redemptionId),
        {
            userId: user.uid,
            reward: "60 UC",
            cost: 100,
            status: "pending",
            createdAt: new Date().toISOString()
        }
    );

    document.getElementById("points").innerText =
        newPoints;

    document.getElementById("appMessage").innerText =
        "✅ Redemption request submitted!";
};

    </script>

</body>
</html>
